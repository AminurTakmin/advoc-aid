<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #2c3444;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }
        .register-left {
            flex: 1;
            padding-left: 60px;
        }
        .register-left h1 {
            font-size: 48px;
            font-weight: 700;
            color: #f1c40f;
        }
        .register-left p {
            margin: 20px 0;
            color: #f2f2f2;
            max-width: 400px;
        }
        .form-container {
            margin-top: 20px;
            max-width: 500px;
        }
        .form-container input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-container button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #d4af37, #b68d2e);
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
        .form-container .toggle {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }
        .form-container .toggle a {
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
        }
        .register-right {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .slogan {
            position: absolute;
            bottom: 50px;
            right: 60px;
            color: #f9f9f9;
            text-align: left;

        }


        .slogan h4 {
            font-weight: normal;
        }
        .slogan h2 {
            font-weight: bold;
            font-size: 40px;
        }
    </style>
</head>
<body>

<div class="register-left">
    <h1>Register</h1>
    <p>Please fill in the details to create your account.</p>

    <form class="form-container" th:action="@{/registration/save}" method="post" th:object="${user}">
        <input type="text" th:field="*{name}" placeholder="Enter Name" required>
        <input type="email" th:field="*{email}" placeholder="Enter Email" required>
        <input type="password" th:field="*{password}" placeholder="Enter Password" required>
        <input type="text" th:field="*{phone}" placeholder="Enter Phone" required>
        <button type="submit">Register</button>
        <div class="toggle">
            Already have an account? <a href="/login" style="color: #f1c40f;">Login here</a>
        </div>
    </form>
</div>

<div class="register-right">
    <div class="slogan">
        <h4>Know Your Law</h4>
        <h2>Advocates rely on <span style="color: #f1c40f;">ADVOCAID</span>
        </h2>
    </div>
    <img src="/images/backgrounds/court.png" width="400px" height="400px">
</div>

</body>
</html>
